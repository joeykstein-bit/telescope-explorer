<!doctype html>
<meta charset="utf-8">
<title>Telescope Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0a0e17;
    --bg-2:#0d1320;
    --surface:#121a29;
    --surface-2:#1b2536;
    --border:#2a3548;
    --border-soft:#1e2938;
    --text:#e9edf5;
    --text-muted:#8fa0b8;
    --text-faint:#5c6a80;
    --accent:#e0a83e;
    --accent-soft:rgba(224,168,62,0.16);
    --accent-text:#1a1408;
    --focus:#e0a83e;

    --c-radio:#111214;
    --c-infrared:#e2483a;
    --c-visible:#3f7fe0;
    --c-particle:#9a6a3f;
    --c-gamma:#a866cf;
    --c-submm:#2fb6a8;
    --c-gravwave:#8a99b3;
    --c-xray:#6fcfe8;

    --discovery:#ffe14d;
    --discovery-text:#4a3c00;

    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Noto Serif', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .app{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #141d30 0%, transparent 55%),
      var(--bg);
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:20px 28px 14px;
    flex-shrink:0;
    border-bottom:1px solid var(--border-soft);
  }
  .wordmark{
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:nowrap;
    min-width:0;
  }
  .wordmark h1{
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    font-size:26px;
    letter-spacing:0.2px;
    margin:0;
    color:var(--text);
    white-space:nowrap;
    flex-shrink:0;
  }
  .wordmark .tag{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-faint);
    border-left:1px solid var(--border);
    padding-left:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
  .wordmark .tag#todayTag{ color:var(--text-muted); }
  .stats{
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.02em;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
    text-align:right;
  }
  .stats b{ color:var(--accent); font-weight:600; }

  .view-toggle{
    display:flex;
    gap:2px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:2px;
    flex-shrink:0;
  }
  .view-btn{
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:6px;
    cursor:pointer;
  }
  .view-btn:hover{ color:var(--text); }
  .view-btn[aria-pressed="true"]{ background:var(--accent-soft); color:var(--accent); }
  .view-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:-1px; }

  /* ---------- stage ---------- */
  .stage{
    position:relative;
    flex:1;
    min-height:0;
    display:flex;
  }

  .globe-wrap{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
    cursor:grab;
    overflow:hidden;
  }
  .globe-wrap.dragging{ cursor:grabbing; }

  canvas#globe{
    display:block;
  }

  .markers{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:1;
    isolation:isolate;
  }

  .marker{
    position:absolute;
    appearance:none;
    -webkit-appearance:none;
    padding:0;
    width:4.5px;
    height:4.5px;
    margin:-2.25px 0 0 -2.25px;
    border-radius:50%;
    border:0.9px solid rgba(255,255,255,0.72);
    box-shadow:0 0 0 1px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.5);
    pointer-events:auto;
    cursor:pointer;
    transition:transform 120ms ease, box-shadow 120ms ease;
    will-change:transform;
  }
  .marker-space{
    width:5.85px;
    height:5.85px;
    margin:-2.925px 0 0 -2.925px;
    border-width:1.17px;
  }
  .marker-space::before{
    content:'';
    position:absolute;
    inset:-7.02px;
    border-radius:50%;
    pointer-events:auto;
  }
  .marker:hover, .marker:focus-visible{
    transform:scale(1.6);
    box-shadow:0 0 0 1px rgba(0,0,0,0.5), 0 0 10px 2px rgba(255,255,255,0.35);
    outline:none;
    z-index:5;
  }
  .marker.active{
    transform:scale(1.7);
    box-shadow:0 0 0 2px var(--accent), 0 0 12px 3px rgba(224,168,62,0.55);
    z-index:6;
  }
  .marker.discovery{
    box-shadow:0 0 0 1.6px var(--discovery), 0 0 8px 2px rgba(255,225,77,0.65);
    animation:discoveryPulse 2.2s ease-in-out infinite;
  }
  .marker.discovery.active{
    box-shadow:0 0 0 2px var(--accent), 0 0 0 4.5px var(--discovery), 0 0 12px 3px rgba(224,168,62,0.55);
  }
  @keyframes discoveryPulse{
    0%, 100%{ box-shadow:0 0 0 1.6px var(--discovery), 0 0 6px 1px rgba(255,225,77,0.55); }
    50%{ box-shadow:0 0 0 1.6px var(--discovery), 0 0 11px 4px rgba(255,225,77,0.85); }
  }
  .marker[data-hidden="1"]{
    display:none;
  }

  .hint{
    position:absolute;
    left:50%;
    bottom:16px;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--text-faint);
    text-transform:uppercase;
    pointer-events:none;
    opacity:0.9;
    text-align:center;
    white-space:nowrap;
  }

  .zoom-control{
    position:absolute;
    right:18px;
    bottom:18px;
    z-index:10;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(18,26,41,0.82);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 10px;
  }
  .zoom-btn{
    width:20px;
    height:20px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    border-radius:50%;
    color:var(--text-muted);
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
  .zoom-btn:hover{ color:var(--text); background:var(--surface-2); }
  .zoom-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:1px; }
  .zoom-slider{
    width:90px;
    accent-color:var(--accent);
    cursor:pointer;
  }

  /* ---------- space view (orbital diagram) ---------- */
  .space-wrap{
    position:relative;
    flex:1;
    display:none;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  body[data-view="space"] .space-wrap{ display:flex; }
  body[data-view="space"] .globe-wrap{ display:none; }
  .space-wrap svg{
    display:block;
    width:100%;
    height:100%;
  }
  .orbit-ring{
    fill:none;
    stroke:rgba(143,160,184,0.28);
    stroke-width:1;
    stroke-dasharray:2.5 4;
  }
  .orbit-link{
    fill:none;
    stroke:rgba(143,160,184,0.22);
    stroke-width:1;
    stroke-dasharray:1.5 3.5;
  }
  .orbit-label{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    fill:var(--text-faint);
  }
  .space-caption{
    position:absolute;
    left:50%;
    top:14px;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    opacity:0.85;
  }

  /* ---------- list view (alphabetical browse) ---------- */
  .list-view{
    flex:1;
    min-height:0;
    display:none;
    flex-direction:column;
    padding:18px 28px;
    gap:12px;
  }
  body[data-view="list"] .list-view{ display:flex; }
  body[data-view="list"] .globe-wrap{ display:none; }
  body[data-view="list"] .stage{ flex-direction:column; }
  body[data-view="list"] .legend{
    position:relative;
    top:auto; left:auto; right:auto;
    width:auto;
    margin:18px 28px 0;
    flex-shrink:0;
  }
  body[data-view="list"] .legend h2{ margin-bottom:6px; }
  body[data-view="list"] .legend .grid-chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  body[data-view="list"] .chip{
    width:auto;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 12px 5px 8px;
  }
  body[data-view="list"] .chip .count{ margin-left:1px; }

  .list-search-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .list-search{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    padding:10px 14px;
    border-radius:8px;
  }
  .list-search::placeholder{ color:var(--text-faint); }
  .list-search:focus{ outline:2px solid var(--focus); outline-offset:-1px; border-color:var(--focus); }
  .list-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
    white-space:nowrap;
    flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .list-scroll{
    flex:1;
    min-height:0;
    overflow-y:auto;
    border:1px solid var(--border-soft);
    border-radius:10px;
    background:var(--surface);
  }
  .list-row{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--border-soft);
    color:var(--text);
    font-family:var(--sans);
    font-size:13.5px;
    padding:10px 16px;
    cursor:pointer;
  }
  .list-row:last-child{ border-bottom:none; }
  .list-row:hover, .list-row:focus-visible{ background:var(--surface-2); outline:none; }
  .list-row.active{ background:var(--accent-soft); }
  .list-row .swatch{
    width:9px;
    height:9px;
    border-radius:50%;
    border:1.2px solid rgba(255,255,255,0.55);
    flex-shrink:0;
  }
  .list-row .rname{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list-row .ddot{
    width:7px; height:7px; border-radius:50%; flex-shrink:0;
    background:var(--discovery);
    box-shadow:0 0 0 1px rgba(0,0,0,0.35), 0 0 5px 1px rgba(255,225,77,0.75);
  }
  .list-row .rloc{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
    flex-shrink:0;
    max-width:38%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .list-empty{
    padding:32px;
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
    font-family:var(--mono);
  }

  /* ---------- legend ---------- */
  .legend{
    position:absolute;
    z-index:10;
    top:18px;
    left:18px;
    width:200px;
    background:rgba(18,26,41,0.82);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    display:flex;
    flex-direction:column;
  }
  .legend-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    width:100%;
    background:none;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-faint);
  }
  .legend-toggle:hover{ color:var(--text); }
  .legend-toggle:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .legend-toggle-icon{
    display:inline-flex;
    font-size:13px;
    line-height:1;
    transition:transform 160ms ease;
  }
  .legend.collapsed .legend-toggle-icon{ transform:rotate(-90deg); }
  .legend-body{
    display:flex;
    flex-direction:column;
    gap:2px;
    margin-top:12px;
  }
  .legend.collapsed{ width:auto; }
  .legend.collapsed .legend-body{ display:none; }
  .legend h2{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin:0 0 8px;
    font-weight:600;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    background:none;
    border:none;
    color:var(--text-muted);
    font-family:var(--sans);
    font-size:12.5px;
    padding:6px 6px;
    border-radius:6px;
    cursor:pointer;
    text-align:left;
    transition:background 120ms ease, color 120ms ease;
  }
  .chip:hover{ background:var(--surface-2); color:var(--text); }
  .chip:focus-visible{ outline:2px solid var(--focus); outline-offset:-1px; }
  .chip .swatch{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
    border:1.3px solid rgba(255,255,255,0.5);
  }
  .chip .label{ flex:1; }
  .chip .count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
    font-variant-numeric:tabular-nums;
  }
  .chip[aria-pressed="false"]{ opacity:0.4; }
  .chip[aria-pressed="false"] .swatch{ opacity:0.5; }

  .legend-discoveries{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--border-soft);
  }
  .discovery-toggle{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    background:none;
    border:1px solid var(--border);
    color:var(--text-muted);
    font-family:var(--sans);
    font-size:12px;
    padding:7px 8px;
    border-radius:6px;
    cursor:pointer;
    text-align:left;
    transition:background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .discovery-toggle:hover{ border-color:var(--text-faint); color:var(--text); }
  .discovery-toggle:focus-visible{ outline:2px solid var(--focus); outline-offset:-1px; }
  .discovery-toggle .dot{
    width:9px; height:9px; border-radius:50%; flex-shrink:0;
    background:var(--discovery);
    box-shadow:0 0 0 1px rgba(0,0,0,0.35), 0 0 6px 1px rgba(255,225,77,0.7);
  }
  .discovery-toggle .label{ flex:1; line-height:1.3; }
  .discovery-toggle .count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--text-faint);
    font-variant-numeric:tabular-nums;
  }
  .discovery-toggle[aria-pressed="true"]{
    background:rgba(255,225,77,0.14);
    border-color:var(--discovery);
    color:var(--text);
  }
  .discovery-status{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.03em;
    color:var(--text-faint);
    margin-top:7px;
    line-height:1.5;
  }

  /* ---------- detail panel ---------- */
  .detail{
    position:absolute;
    top:0;
    right:0;
    bottom:0;
    width:380px;
    max-width:100%;
    background:var(--surface);
    border-left:1px solid var(--border);
    box-shadow:-24px 0 48px rgba(0,0,0,0.35);
    transform:translateX(100%);
    transition:transform 240ms cubic-bezier(.2,.7,.2,1);
    display:flex;
    flex-direction:column;
    z-index:20;
  }
  .detail.open{ transform:translateX(0); }

  .detail-close{
    position:absolute;
    top:14px;
    right:14px;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .detail-close:hover{ color:var(--text); border-color:var(--text-faint); }

  .detail-body{
    padding:56px 26px 26px;
    overflow-y:auto;
    flex:1;
  }
  .detail-badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:5px 10px 5px 8px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
    margin-bottom:16px;
  }
  .detail-badge .swatch{
    width:9px; height:9px; border-radius:50%;
    border:1.2px solid rgba(255,255,255,0.55);
  }
  .detail-body h3{
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    font-size:25px;
    margin:0 0 6px;
    color:var(--text);
    text-wrap:balance;
  }
  .detail-loc{
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 10px;
  }
  .detail-site{
    display:flex;
    width:fit-content;
    align-items:center;
    gap:5px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--accent);
    text-decoration:none;
    margin:0 0 20px;
    border-bottom:1px solid rgba(224,168,62,0.4);
  }
  .detail-site:hover{ border-color:var(--accent); }
  .specs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 16px;
    padding:14px 16px;
    background:var(--bg-2);
    border:1px solid var(--border-soft);
    border-radius:8px;
    margin-bottom:20px;
  }
  .specs div{ min-width:0; }
  .specs .k{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:2px;
  }
  .specs .v{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .detail-body p.copy{
    font-size:14.5px;
    line-height:1.65;
    color:#c7d0e0;
    margin:0;
    max-width:60ch;
  }

  .detail-discovery{
    margin-top:22px;
    padding:14px 16px;
    background:rgba(255,225,77,0.08);
    border:1px solid rgba(255,225,77,0.4);
    border-radius:8px;
    max-width:60ch;
  }
  .detail-discovery .dh{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--discovery);
    margin-bottom:8px;
  }
  .detail-discovery .dh .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--discovery);
    box-shadow:0 0 6px 1px rgba(255,225,77,0.7);
  }
  .detail-discovery .dtitle{
    font-size:14px;
    font-weight:600;
    color:var(--text);
    margin:0 0 6px;
    line-height:1.4;
  }
  .detail-discovery p{
    font-size:13px;
    line-height:1.6;
    color:#c7d0e0;
    margin:0 0 10px;
  }
  .detail-discovery a{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--discovery);
    text-decoration:none;
    border-bottom:1px solid rgba(255,225,77,0.5);
  }
  .detail-discovery a:hover{ border-color:var(--discovery); }
  .detail-discovery .ddate{
    font-family:var(--mono);
    font-size:10px;
    color:var(--text-faint);
    margin-top:8px;
  }

  /* ---------- backdrop for mobile sheet ---------- */
  .backdrop{
    position:absolute;
    inset:0;
    background:rgba(4,6,10,0.5);
    opacity:0;
    pointer-events:none;
    transition:opacity 200ms ease;
    z-index:15;
  }
  .backdrop.show{ opacity:1; pointer-events:auto; }

  @media (max-width: 760px){
    .topbar{ padding:16px 16px 12px; flex-wrap:wrap; row-gap:10px; }
    .wordmark h1{ font-size:21px; }
    .wordmark .tag{ display:none; }

  function slugify(name){
    return name
      .normalize('NFKD').replace(/\p{M}/gu,'')
      .toLowerCase()
      .replace(/&[a-z]+;/g,' ')
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'');
  }

  ALL.forEach(function(t){ t.site = SITES[t.name] || ''; });

  var DISCOVERIES = {};

  /* ---------------- geometry / projection ---------------- */

  var D2R = Math.PI/180;

  function toXYZ(lonDeg, latDeg){
    var lon = lonDeg*D2R, lat = latDeg*D2R;
    return [ Math.cos(lat)*Math.sin(lon), Math.sin(lat), Math.cos(lat)*Math.cos(lon) ];
  }

  var rot = { yaw: 0.55, pitch: -0.30 };   // radians
  var vel = { yaw: 0.0009, pitch: 0 };     // idle auto-rotate until first drag
  var userInteracted = false;

  if (reducedMotion) vel.yaw = 0;

  function rotatePoint(p){
    var x=p[0], y=p[1], z=p[2];
    var cy=Math.cos(rot.yaw), sy=Math.sin(rot.yaw);
    var x1 = x*cy + z*sy;
    var z1 = -x*sy + z*cy;
    var y1 = y;
    var cx=Math.cos(rot.pitch), sx=Math.sin(rot.pitch);
    var y2 = y1*cx - z1*sx;
    var z2 = y1*sx + z1*cx;
    return [x1, y2, z2];

  /* ---------------- canvas setup ---------------- */

  var wrap = document.getElementById('globeWrap');
  var canvas = document.getElementById('globe');

  function resize(){

    var size = Math.max(220, Math.min(w, h) - 24);

    canvas.style.width = size+'px'; canvas.style.height = size+'px';

    markersEl.style.left = ((w-size)/2)+'px';
    markersEl.style.top = ((h-size)/2)+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    baseR = size/2 - 2;
    cx = size/2; cy = size/2;
    applyZoom();

  /* ---------------- topography stipple (precomputed once) ---------------- */

  function pointInRing(lon, lat, ring){
    var inside = false;
    for (var i=0, j=ring.length-2; i<ring.length; j=i, i+=2){
      var xi=ring[i], yi=ring[i+1], xj=ring[j], yj=ring[j+1];
      var intersect = ((yi>lat) !== (yj>lat)) &&
        (lon < (xj-xi) * (lat-yi) / (yj-yi) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  var STIPPLE = [];
  (function buildStipple(){
    for (var pIdx=0; pIdx<LAND.length; pIdx++){
      var rings = LAND[pIdx];
      var outer = rings[0];
      var minLon=999, maxLon=-999, minLat=999, maxLat=-999;
      for (var i=0;i<outer.length;i+=2){
        var lo=outer[i], la=outer[i+1];
        if(lo<minLon)minLon=lo; if(lo>maxLon)maxLon=lo;
        if(la<minLat)minLat=la; if(la>maxLat)maxLat=la;
      }
      var area = (maxLon-minLon)*(maxLat-minLat);
      var n = Math.max(1, Math.min(26, Math.round(area/9)));
      var tries = n*7, got=0;
      for (var t=0; t<tries && got<n; t++){
        var lo2 = minLon + Math.random()*(maxLon-minLon);
        var la2 = minLat + Math.random()*(maxLat-minLat);
        if (pointInRing(lo2, la2, outer)){
          STIPPLE.push(toXYZ(lo2, la2));
          got++;
        }
      }
    }
  })();

  /* ---------------- land polygons pre-projected to XYZ ---------------- */

  var LAND_XYZ = LAND.map(function(rings){
    return rings.map(function(ring){
      var out = [];
      for (var i=0;i<ring.length;i+=2) out.push(toXYZ(ring[i], ring[i+1]));
      return out;
    });
  });

  /* ---------------- render ---------------- */

  function project(v){
    return [ cx + R*v[0], cy - R*v[1], v[2] ];
  }

  function drawGlobe(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // sphere base w/ lit-sphere shading
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI*2);
    ctx.clip();

    var grad = ctx.createRadialGradient(cx - R*0.38, cy - R*0.4, R*0.05, cx - R*0.1, cy - R*0.05, R*1.5);
    grad.addColorStop(0, '#c7c9cd');
    grad.addColorStop(0.45, '#83868c');
    grad.addColorStop(0.8, '#3d3f45');
    grad.addColorStop(1, '#17181b');
    ctx.fillStyle = grad;
    ctx.fillRect(cx-R, cy-R, R*2, R*2);

    // land masses
    ctx.fillStyle = 'rgba(222,224,227,0.60)';
    ctx.strokeStyle = 'rgba(35,36,40,0.55)';
    ctx.lineWidth = 0.7;
    for (var i=0;i<LAND_XYZ.length;i++){
      var rings = LAND_XYZ[i];
      var visible = 0, total = 0;
      ctx.beginPath();
      for (var r=0;r<rings.length;r++){
        var ring = rings[r];
        for (var k=0;k<ring.length;k++){
          var rp = rotatePoint(ring[k]);
          total++;
          if (rp[2] > 0) visible++;
          var pp = project(rp);
          if (k===0) ctx.moveTo(pp[0], pp[1]); else ctx.lineTo(pp[0], pp[1]);
        }
        ctx.closePath();
      }
      if (visible > total*0.35){
        ctx.fill('evenodd');
        ctx.stroke();
      }
    }

    // topography stipple
    ctx.fillStyle = 'rgba(30,31,34,0.35)';
    for (var s=0;s<STIPPLE.length;s++){
      var rp2 = rotatePoint(STIPPLE[s]);
      if (rp2[2] <= 0.02) continue;
      var pp2 = project(rp2);
      ctx.fillRect(pp2[0]-0.4, pp2[1]-0.4, 0.9, 0.9);
    }

    // limb vignette for depth
    var vg = ctx.createRadialGradient(cx,cy,R*0.72,cx,cy,R);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,0.38)');
    ctx.fillStyle = vg;
    ctx.fillRect(cx-R,cy-R,R*2,R*2);

    ctx.restore();

    // rim
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* ---------------- markers ---------------- */

  function updateMarkers(){
    for (var i=0;i<TELESCOPES.length;i++){
      var t = TELESCOPES[i], el = markerEls[i];
      var rp = rotatePoint(t._xyz);
      if (!passesFilters(t)){ el.dataset.hidden = '1'; continue; }
      var fade = (rp[2] + 0.06) / 0.18;
      if (fade <= 0){ el.dataset.hidden = '1'; continue; }
      el.dataset.hidden = '';
      applyDiscoveryClass(el, t);
      var pp = project(rp);
      el.style.left = pp[0]+'px';
      el.style.top = pp[1]+'px';

  /* ---------------- space view (orbital diagram) ---------------- */

  var spaceWrap = document.getElementById('spaceWrap');

  var SVGNS = 'http://www.w3.org/2000/svg';

  function buildSpaceSvg(size){
    var cx = size/2, cy = size/2;
    var earthR = size*0.085;

    RING_GEOM.leo   = { cx:cx, cy:cy, rx:size*0.16, ry:size*0.058 };
    RING_GEOM.heo   = { cx:cx, cy:cy, rx:size*0.30, ry:size*0.11 };
    RING_GEOM.l2    = { cx:cx + size*0.31, cy:cy - size*0.13, rx:size*0.065, ry:size*0.026 };
    RING_GEOM.helio = { cx:cx - size*0.31, cy:cy + size*0.17, rx:size*0.07,  ry:size*0.03 };

    while (spaceSvg.firstChild) spaceSvg.removeChild(spaceSvg.firstChild);

    var defs = svgEl('defs', {});
    var grad = svgEl('radialGradient', { id:'spaceEarthGrad', cx:'36%', cy:'30%', r:'75%' });
    grad.appendChild(svgEl('stop', { offset:'0%',  'stop-color':'#c7c9cd' }));
    grad.appendChild(svgEl('stop', { offset:'42%', 'stop-color':'#5f7fae' }));
    grad.appendChild(svgEl('stop', { offset:'78%', 'stop-color':'#233b63' }));
    grad.appendChild(svgEl('stop', { offset:'100%','stop-color':'#0f1a2e' }));
    defs.appendChild(grad);
    spaceSvg.appendChild(defs);

    spaceSvg.appendChild(svgEl('line', { class:'orbit-link', x1:cx, y1:cy, x2:RING_GEOM.l2.cx,    y2:RING_GEOM.l2.cy }));
    spaceSvg.appendChild(svgEl('line', { class:'orbit-link', x1:cx, y1:cy, x2:RING_GEOM.helio.cx, y2:RING_GEOM.helio.cy }));

    ['leo','heo','l2','helio'].forEach(function(k){
      var g = RING_GEOM[k];
      spaceSvg.appendChild(svgEl('ellipse', { class:'orbit-ring', cx:g.cx, cy:g.cy, rx:g.rx, ry:g.ry }));
    });

    spaceSvg.appendChild(svgEl('circle', {
      cx:cx, cy:cy, r:earthR, fill:'url(#spaceEarthGrad)',
      stroke:'rgba(255,255,255,0.18)', 'stroke-width':1
    }));

    function label(x, y, text, anchor){
      var t = svgEl('text', { class:'orbit-label', x:x, y:y, 'text-anchor':anchor||'middle' });
      t.textContent = text;
      spaceSvg.appendChild(t);

    label(cx, RING_GEOM.heo.cy + RING_GEOM.heo.ry + 16, 'High Earth orbit');
    label(RING_GEOM.l2.cx, RING_GEOM.l2.cy - RING_GEOM.l2.ry - 10, 'Sun–Earth L2 · ~1.5M km');
    label(RING_GEOM.helio.cx, RING_GEOM.helio.cy + RING_GEOM.helio.ry + 16, 'Earth-trailing orbit');
  }

  function resizeSpace(){
    var w = spaceWrap.clientWidth, h = spaceWrap.clientHeight;

    spaceMarkersEl.style.top = ((h-size)/2)+'px';

  SPACE_TELESCOPES.forEach(function(t, i){
    var globalIdx = TELESCOPES.length + i;

    el.className = 'marker marker-space';
    el.type = 'button';

  function updateSpaceMarkers(){
    var now = performance.now();

    lastSpaceTick = now;

    SPACE_TELESCOPES.forEach(function(t, i){

      var el = markerEls[globalIdx];
      if (!passesFilters(t)){ el.dataset.hidden = '1'; return; }
      el.dataset.hidden = '';
      applyDiscoveryClass(el, t);

      spaceAngle[t.id] = (spaceAngle[t.id] || 0) + (RING_SPEED[t.ring] || 0.05) * dt;

      var a = spaceAngle[t.id];

      var py = g.cy + Math.sin(a)*g.ry;
      el.style.left = px+'px';
      el.style.top = py+'px';
      el.style.opacity = String(0.6 + 0.4*((Math.sin(a)+1)/2));

  /* ---------------- interaction ---------------- */

  var dragging = false, lastX=0, lastY=0, lastT=0, moved=false;

  function pointerDown(e){

    if (!dragging) return;
    var p = (e.touches ? e.touches[0] : e);

    var now = performance.now(), dt = Math.max(1, now-lastT);
    if (Math.abs(dx)+Math.abs(dy) > 1) moved = true;
    rot.yaw += dx*0.008;
    rot.pitch = Math.max(-1.35, Math.min(1.35, rot.pitch - dy*0.008));
    vel.yaw = (dx*0.008)/(dt/16);
    vel.pitch = (-dy*0.008)/(dt/16);
    lastX = p.clientX; lastY = p.clientY; lastT = now;
    e.preventDefault();

        rot.pitch = Math.max(-1.35, Math.min(1.35, rot.pitch));
        vel.yaw *= userInteracted ? 0.94 : 1;

  function fmtCoord(lat, lon){

      '<div class="specs">' +
        '<div><div class="k">Type</div><div class="v">'+t.type+'</div></div>' +
        '<div><div class="k">Aperture</div><div class="v">'+t.aperture+'</div></div>' +
        '<div><div class="k">'+(t.kind==='space'?'Launched':'Completed')+'</div><div class="v">'+t.built+'</div></div>' +
        lastSpecRow +
      '</div>' +
      '<p class="copy">'+t.text+'</p>' +
      discoveryHtml(t);
    detail.classList.add('open');
    detail.setAttribute('aria-hidden','false');
    backdrop.classList.add('show');
    syncListActive();
  }
  function closeDetail(){
    detail.classList.remove('open');
    detail.setAttribute('aria-hidden','true');
    backdrop.classList.remove('show');
    markerEls.forEach(function(el){ el.classList.remove('active'); });
    activeIdx = -1;
    syncListActive();
  }
  document.getElementById('detailClose').addEventListener('click', closeDetail);
  backdrop.addEventListener('click', closeDetail);
  window.addEventListener('keydown', function(e){ if (e.key==='Escape') closeDetail(); });

  /* ---------------- list view (alphabetical browse) ---------------- */

  var listScroll = document.getElementById('listScroll');
  var listSearch = document.getElementById('listSearch');
  var listCount = document.getElementById('listCount');
  var listRowEls = [];

  function syncListActive(){
    listRowEls.forEach(function(row){
      row.classList.toggle('active', parseInt(row.dataset.idx, 10) === activeIdx);
    });
  }

  function renderList(){
    var q = listSearch.value.trim().toLowerCase();
    var items = ALL.map(function(t, idx){ return { t:t, idx:idx }; })
      .filter(function(o){
        if (!passesFilters(o.t)) return false;
        if (!q) return true;
        return o.t.name.toLowerCase().indexOf(q) !== -1 || o.t.loc.toLowerCase().indexOf(q) !== -1;
      })
      .sort(function(a, b){ return a.t.name.localeCompare(b.t.name); });

    listCount.textContent = items.length + ' of ' + ALL.length;

    if (!items.length){
      listScroll.innerHTML = '<div class="list-empty">No observatories match your search.</div>';
      listRowEls = [];
      return;
    }

    listScroll.innerHTML = items.map(function(o){
      var ddot = DISCOVERIES[o.t.id] ? '<span class="ddot" title="Recent discovery"></span>' : '';
      return '<button type="button" class="list-row" data-idx="'+o.idx+'">' +
        '<span class="swatch" style="background:'+CATS[o.t.cat].hex+'"></span>' +
        '<span class="rname">'+o.t.name+'</span>' +
        ddot +
        '<span class="rloc">'+o.t.loc+'</span>' +
      '</button>';
    }).join('');

    listRowEls = Array.prototype.slice.call(listScroll.querySelectorAll('.list-row'));
    listRowEls.forEach(function(row){
      row.addEventListener('click', function(){
        openDetail(parseInt(row.dataset.idx, 10));
      });
    });
    syncListActive();
  }

  listSearch.addEventListener('input', renderList);

  var viewSpaceBtn = document.getElementById('viewSpaceBtn');
  var viewGlobeBtn = document.getElementById('viewGlobeBtn');
  var viewListBtn = document.getElementById('viewListBtn');
  function setView(mode){
    document.body.dataset.view = mode;
    viewSpaceBtn.setAttribute('aria-pressed', String(mode === 'space'));
    viewGlobeBtn.setAttribute('aria-pressed', String(mode === 'globe'));
    viewListBtn.setAttribute('aria-pressed', String(mode === 'list'));
    if (mode === 'list') renderList();
    if (mode === 'space'){ lastSpaceTick = null; resizeSpace(); }
  }
  viewSpaceBtn.addEventListener('click', function(){ setView('space'); });
  viewGlobeBtn.addEventListener('click', function(){ setView('globe'); });
  viewListBtn.addEventListener('click', function(){ setView('list'); });

  /* ---------------- stats ---------------- */

  document.getElementById('stats').innerHTML =
    '<b>'+ALL.length+'</b> observatories &nbsp;&middot;&nbsp; <b>'+Object.keys(CATS).length+'</b> spectra';

  document.getElementById('todayTag').textContent =
    new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  /* ---------------- recent discoveries (live feed) ---------------- */

  var discoveryToggle = document.getElementById('discoveryToggle');
  var discoveryCountEl = document.getElementById('discoveryCount');
  var discoveryStatusEl = document.getElementById('discoveryStatus');
  var DISCOVERY_CACHE_KEY = 'telescopeExplorer.discoveries.v1';
  var DISCOVERY_INTERVAL_MS = 2 * 60 * 60 * 1000; // check every 2 hours

  function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function textMentionsTelescope(text, t){
    var hay = ' ' + text.toLowerCase() + ' ';
    var terms = [t.name].concat(t.aka || []);
    for (var i=0; i<terms.length; i++){
      var term = terms[i].replace(/&[a-z]+;/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
      if (!term) continue;
      var re = new RegExp('(^|[^a-z0-9])' + escapeRe(term) + '($|[^a-z0-9])');
      if (re.test(hay)) return true;
    }
    return false;
  }

  function shortSummary(text, limit){
    text = text.replace(/\s+/g, ' ').trim();
    if (text.length <= limit) return text;
    var cut = text.slice(0, limit);
    var lastSpace = cut.lastIndexOf(' ');
    if (lastSpace > limit * 0.6) cut = cut.slice(0, lastSpace);
    return cut + '&hellip;';
  }

  var CORS_PROXIES = [
    function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
    function(u){ return 'https://corsproxy.io/?url=' + encodeURIComponent(u); }
  ];

  function fetchViaProxy(url){
    function tryProxy(i){
      if (i >= CORS_PROXIES.length) return Promise.reject(new Error('all discovery proxies failed'));
      return fetch(CORS_PROXIES[i](url)).then(function(r){
        if (!r.ok) throw new Error('proxy status ' + r.status);
        return r.text();
      }).catch(function(){ return tryProxy(i+1); });
    }
    return tryProxy(0);
  }

  function fetchArxivEntries(){
    var q = 'search_query=cat:astro-ph*+OR+cat:gr-qc+OR+cat:hep-ex' +
      '&sortBy=submittedDate&sortOrder=descending&max_results=300';
    var url = 'https://export.arxiv.org/api/query?' + q;
    return fetchViaProxy(url).then(function(xmlText){
      var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
      var entries = Array.prototype.slice.call(doc.getElementsByTagName('entry'));
      return entries.map(function(entry){
        function get(tag){
          var el = entry.getElementsByTagName(tag)[0];
          return el ? el.textContent.trim() : '';
        }
        return {
          title: get('title').replace(/\s+/g, ' '),
          summary: get('summary').replace(/\s+/g, ' '),
          url: get('id'),
          published: new Date(get('published'))
        };
      });
    });
  }

  function fetchNasaEntries(){
    return fetch('https://www.nasa.gov/feed/').then(function(r){
      if (!r.ok) throw new Error('nasa feed status ' + r.status);
      return r.text();
    }).then(function(xmlText){
      var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
      var items = Array.prototype.slice.call(doc.getElementsByTagName('item'));
      return items.map(function(item){
        function get(tag){
          var el = item.getElementsByTagName(tag)[0];
          return el ? el.textContent.trim() : '';
        }
        return {
          title: get('title'),
          summary: get('description').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(),
          url: get('link'),
          published: new Date(get('pubDate'))
        };
      });
    });
  }

  function onDiscoveriesUpdated(statusNote){
    var n = Object.keys(DISCOVERIES).length;
    discoveryCountEl.textContent = String(n);
    discoveryStatusEl.innerHTML = statusNote || ('Checked ' +
      new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) +
      ' &middot; next check in 2h &middot; via arXiv & NASA');
    updateMarkers();
    if ((document.body.dataset.view || 'globe') === 'space') updateSpaceMarkers();
    renderList();
    if (activeIdx >= 0) openDetail(activeIdx);
  }

  function refreshDiscoveries(){
    discoveryStatusEl.innerHTML = 'Checking for new discoveries&hellip;';
    var weekAgo = Date.now() - 7*24*60*60*1000;

    Promise.all([
      fetchArxivEntries().catch(function(e){ console.warn('arXiv feed unavailable', e); return []; }),
      fetchNasaEntries().catch(function(e){ console.warn('NASA feed unavailable', e); return []; })
    ]).then(function(results){
      var entries = results[0].concat(results[1])
        .filter(function(e){ return e.published && !isNaN(e.published.getTime()) && e.published.getTime() >= weekAgo; })
        .sort(function(a, b){ return b.published - a.published; });

      var found = {};
      entries.forEach(function(e){
        ALL.forEach(function(t){
          if (found[t.id]) return;
          if (textMentionsTelescope(e.title + ' ' + e.summary, t)){
            found[t.id] = {
              title: e.title,
              summary: shortSummary(e.summary, 240),
              url: e.url,
              published: e.published.toISOString()
            };
          }
        });
      });

      DISCOVERIES = found;
      try {
        localStorage.setItem(DISCOVERY_CACHE_KEY, JSON.stringify({ fetchedAt: Date.now(), data: found }));
      } catch(e){}
      onDiscoveriesUpdated();
    }).catch(function(err){
      console.warn('Discovery refresh failed', err);
      discoveryStatusEl.innerHTML = 'Live discovery feed unavailable right now &middot; will retry later.';
    });
  }

  discoveryToggle.addEventListener('click', function(){
    recentOnly = !recentOnly;
    discoveryToggle.setAttribute('aria-pressed', String(recentOnly));
    updateMarkers();
    if ((document.body.dataset.view || 'globe') === 'space') updateSpaceMarkers();
    renderList();
  });

  (function bootDiscoveries(){
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(DISCOVERY_CACHE_KEY) || 'null'); } catch(e){}
    var now = Date.now();
    if (cached && cached.data && (now - cached.fetchedAt) < DISCOVERY_INTERVAL_MS){
      DISCOVERIES = cached.data;
      var age = now - cached.fetchedAt;
      onDiscoveriesUpdated('Loaded cached results from ' +
        new Date(cached.fetchedAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) +
        ' &middot; next check in ' + Math.max(1, Math.round((DISCOVERY_INTERVAL_MS - age)/60000)) + 'm');
      setTimeout(refreshDiscoveries, DISCOVERY_INTERVAL_MS - age);
    } else {
      refreshDiscoveries();
    }
    setInterval(refreshDiscoveries, DISCOVERY_INTERVAL_MS);
  })();

  /* ---------------- boot ---------------- */

  window.addEventListener('resize', function(){
    resize();
    if ((document.body.dataset.view || 'globe') === 'space') resizeSpace();
  });
  resize();
  requestAnimationFrame(tick);

})();
</script>
